name: "Cloud Functions Buildkite Plugin"
description: "This buildkite plugin can be used to deploy code to Cloud Functions"
author: "Jash Parekh <jash389@gmail.com>"
requirements:
  - bash
  - docker
configuration:
  properties:
    gcp_project:
      type: string
      description: "GCP project ID that hosts the cloud function"
    gcp_region:
      type: string
      description: "GCP region of the cloud function"
    cloud_function_name:
      type: string
      description: "Name of the cloud function"
    cloud_function_directory:
      type: string
      description: "Directory of the repository that holds the function's code"
    mode:
      type: string
      enum: ["apply", "plan", "validate"]
      description: "apply deploys (default), plan shows what a deployment would do without changing anything, validate checks the options and the archive offline without credentials"
    annotate:
      type: boolean
      description: "Add a Buildkite annotation that summarises the deployment (default: false)"
    annotation_context:
      type: string
      description: "Context of the annotation, so several deployments can each keep their own (default: cloud-functions-<cloud_function_name>)"
    exclude:
      type: array
      items:
        type: string
      description: "Shell-style globs, relative to cloud_function_directory, of files that are not uploaded (default: none)"
    generation:
      type: integer
      enum: [1, 2]
      description: "Generation of the function: 1 (Cloud Functions v1 API) or 2 (Cloud Run functions, v2 API) (default: 1)"
    gcp_service_account:
      type: string
      description: "Service account key (JSON). May also be given as the gcp_service_account environment variable. Without it, Application Default Credentials are used"
    wait:
      type: boolean
      description: "Wait for the deployment to finish and fail the step if it fails (default: true)"
    wait_timeout:
      type: integer
      description: "Seconds to wait for the deployment to finish (default: 600)"
    custom_image:
      type: string
      description: "Docker image used to run the deployment (default: python:3.15-slim)"
    debug_mode:
      type: boolean
      description: "Log extra details (default: false)"
    docker_pull_retries:
      type: integer
      description: "How many times to try pulling the image (default: 3)"
  required:
    - gcp_project
    - gcp_region
    - cloud_function_name
    - cloud_function_directory
  additionalProperties: false
