[project]
name = "cloud-functions-buildkite-plugin"
version = "1.0.0"
description = "Buildkite plugin for deploying code to Google Cloud Functions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jash Parekh", email = "jashparekh@wayfair.com"}
]
dependencies = [
    "google-api-python-client>=2.186.0",
    "google-auth>=2.42.0",
    "google-cloud-storage>=3.4.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.4",
    "types-requests>=2.32.0.20241016",
]

[tool.uv]
# Not a distributable package: `uv sync` installs only the dependencies
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "W",    # pycodestyle warnings
]
ignore = [
    "S101",   # Use of assert (allow in tests)
    "N818",   # Exception name should end with Error (legacy exceptions)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Allow asserts in tests
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = [
    "--verbose",
    "--cov=plugin_scripts",
    "--cov-report=xml",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["plugin_scripts"]
branch = true
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]

