services:
  test:
    image: "buildkite/plugin-tester:v5.0.0"
    volumes:
      - ".:/plugin"

  lint:
    image: "buildkite/plugin-linter:v3.1.0"
    command: ['--id', 'wayfair-incubator/cloud-functions']
    volumes:
      - ".:/plugin"

  shfmt:
    build:
      context: .
      dockerfile: "docker/shfmt.dockerfile"
    command: "-s -d ." # (s)implify, show a (d)iff and fail when the code is not formatted; use `-s -w .` to fix
    volumes:
      - "./hooks:/plugin/hooks"
      - "./.github/scripts:/plugin/scripts"

  devbox: &devbox
    build:
      dockerfile: "./docker/devbox.dockerfile"
      context: "."
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    volumes:
      - "./:/app"

  # Run all the tests and linting locally
  py-test:
    <<: *devbox
    command: "docker/run_tests.sh --format-code"
    volumes:
      - "./:/app"

  # Run ruff linter (check mode)
  ruff-check:
    <<: *devbox
    command: "ruff check plugin_scripts tests"
    volumes:
      - "./:/app"

  # Run ruff linter (fix mode)
  ruff-lint:
    <<: *devbox
    command: "ruff check --fix plugin_scripts tests"
    volumes:
      - "./:/app"

  # Run ruff formatter (check mode)
  ruff-format-check:
    <<: *devbox
    command: "ruff format --check plugin_scripts tests"
    volumes:
      - "./:/app"

  # Run ruff formatter (format mode)
  ruff-format:
    <<: *devbox
    command: "ruff format plugin_scripts tests"
    volumes:
      - "./:/app"

  # Run mypy type checking
  mypy:
    <<: *devbox
    command: "mypy plugin_scripts tests"
    volumes:
      - "./:/app"

  # Refresh uv.lock (add --upgrade to bump every pin)
  lock-requirements:
    <<: *devbox
    entrypoint: "/bin/bash"
    user: root
    command: "docker/lock_requirements.sh"

volumes:
  home:
  env:
    driver: local
